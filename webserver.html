<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helmholtz + Motor Control</title>
  <style>
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 2rem auto;
    max-width: 800px;
    line-height: 1.6;
    background: #f9fafb;
    color: #222;
  }

  h1 {
    margin-top: 0;
    font-size: 1.8rem;
    text-align: center;
    color: #2a4d8f;
  }

  fieldset {
    border: none;
    border-radius: 12px;
    padding: 1.2rem;
    margin-bottom: 1.5rem;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  legend {
    font-weight: bold;
    color: #2a4d8f;
    padding: 0 .4rem;
  }

  label {
    display: inline-block;
    min-width: 9rem;
    font-weight: 500;
    color: #333;
    white-space: nowrap;
  }

  input[type="number"], select {
    padding: .4rem .5rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: .95rem;
    transition: border-color 0.2s ease;
  }

  input[type="number"]:focus, select:focus {
    outline: none;
    border-color: #2a4d8f;
  }

  .row {
    display: flex;
    gap: 1rem;
    align-items: center;
    margin: .6rem 0;
    flex-wrap: wrap;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: .8rem;
    justify-content: center;
    margin: 1.2rem 0;
  }

  button {
    padding: .6rem 1.2rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 500;
    transition: background 0.2s ease, transform 0.1s ease;
    background: #2a4d8f;
    color: #fff;
  }

  button:hover:enabled {
    background: #1e3b6e;
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #log {
    white-space: pre-wrap;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: .75rem;
    min-height: 8rem;
    font-family: monospace;
    background: #fff;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
  }

  .ok { color: #0a7; font-weight: bold; }
  .err { color: #b00; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Helmholtz + Motor Control</h1>

  <fieldset>
    <legend>Helmholtz Coils</legend>
    <div class="row">
      <strong>X:</strong>
      <label for="xmag">Magnitude&nbsp;(0–255)</label>
      <input id="xmag" type="number" min="0" max="255" step="1" value="0" />
      <label for="xdir">Direction</label>
      <select id="xdir">
        <option value="1">Forward</option>
        <option value="-1">Reverse</option>
      </select>
    </div>
    <div class="row">
      <strong>Y:</strong>
      <label for="ymag">Magnitude&nbsp;(0–255)</label>
      <input id="ymag" type="number" min="0" max="255" step="1" value="0" />
      <label for="ydir">Direction</label>
      <select id="ydir">
        <option value="1">Forward</option>
        <option value="-1">Reverse</option>
      </select>
    </div>
    <div class="row">
      <strong>Z:</strong>
      <label for="zmag">Magnitude&nbsp;(0–255)</label>
      <input id="zmag" type="number" min="0" max="255" step="1" value="0" />
      <label for="zdir">Direction</label>
      <select id="zdir">
        <option value="1">Forward</option>
        <option value="-1">Reverse</option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend>Motor</legend>
    <div class="row">
      <strong>Motor:</strong>
      <label for="mmag">Speed&nbsp;(0–255)</label>
      <input id="mmag" type="number" min="0" max="255" step="1" value="0" />
      <label for="mdir">Direction</label>
      <select id="mdir">
        <option value="1">Forward</option>
        <option value="-1">Reverse</option>
      </select>
    </div>
  </fieldset>

  <div class="buttons">
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <button id="send" disabled>Send</button>
    <button id="stopAll" disabled>Stop All</button>
  </div>

  <h3>Log</h3>
  <div id="log"></div>

  <script>
    let port, writer, reader, inputDone, outputDone;

    const $ = (id) => document.getElementById(id);
    const setConnected = (on) => {
      $("connect").disabled = on;
      $("disconnect").disabled = !on;
      $("send").disabled = !on;
      $("stopAll").disabled = !on;
    };

    const log = (msg, cls="") => {
      const el = $("log");
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    };

    async function connect() {
      try {
        if (!("serial" in navigator)) {
          alert("Your browser does not support Web Serial. Use Chrome or Edge.");
          return;
        }
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const encoder = new TextEncoderStream();
        outputDone = encoder.readable.pipeTo(port.writable);
        writer = encoder.writable.getWriter();

        const decoder = new TextDecoderStream();
        inputDone = port.readable.pipeTo(decoder.writable);
        reader = decoder.readable.getReader();

        setConnected(true);
        log("Connected.", "ok");
        readLoop();
      } catch (e) {
        log("Connect error: " + e, "err");
      }
    }

    async function readLoop() {
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) log("[RX] " + value.trim());
        }
      } catch (e) {
        log("Read error: " + e, "err");
      }
    }

    async function disconnect() {
      try {
        if (reader) { await reader.cancel(); await inputDone.catch(()=>{}); reader = null; }
        if (writer) { await writer.close(); await outputDone.catch(()=>{}); writer = null; }
        if (port)   { await port.close(); port = null; }
        setConnected(false);
        log("Disconnected.", "ok");
      } catch (e) {
        log("Disconnect error: " + e, "err");
      }
    }

    function clamp255(n) {
      n = Number(n) || 0;
      if (n < 0) n = 0;
      if (n > 255) n = 255;
      return Math.round(n);
    }

    async function sendOnce() {
      if (!writer) return;
      const xmag = clamp255($("xmag").value);
      const xdir = Number($("xdir").value) || 1;
      const ymag = clamp255($("ymag").value);
      const ydir = Number($("ydir").value) || 1;
      const zmag = clamp255($("zmag").value);
      const zdir = Number($("zdir").value) || 1;
      const mmag = clamp255($("mmag").value);
      const mdir = Number($("mdir").value) || 1;

      const line = `XMAG=${xmag},XDIR=${xdir},YMAG=${ymag},YDIR=${ydir},ZMAG=${zmag},ZDIR=${zdir},MMAG=${mmag},MDIR=${mdir}
`;
      try {
        await writer.write(line);
        log("[TX] " + line.trim());
      } catch (e) {
        log("Write error: " + e, "err");
      }
    }

    async function stopAll() {
      $("xmag").value = 0; $("ymag").value = 0; $("zmag").value = 0; $("mmag").value = 0;
      await sendOnce();
    }

    $("connect").addEventListener("click", connect);
    $("disconnect").addEventListener("click", disconnect);
    $("send").addEventListener("click", sendOnce);
    $("stopAll").addEventListener("click", stopAll);
  </script>
</body>
</html>
